name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/codex/dynamo-diff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Read and validate the package version
        id: version
        run: |
          python - <<'PY'
          import ast, os, pathlib, tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          tree = ast.parse(pathlib.Path('src/dynamo_diff/__init__.py').read_text())
          versions = [ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)]
          assert versions == [metadata['version']], 'Package and CLI versions differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + metadata['version'], file=output)
          PY
      - name: Install pinned build and verification tools
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Build source archive and wheel
        run: python -m build --no-isolation
      - name: Verify the installed wheel without ML runtimes
        run: |
          python -m pip install --no-deps dist/*.whl
          python tools/check_release.py --require-wheel --junit artifacts/pypi-build-tests.xml
          python -m pytest -q -o pythonpath= --import-mode=importlib benchmarks/agent_pilot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/dynamo-diff/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish verified distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-public-install:
    needs: [build-and-verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install the published package in a fresh environment
        env:
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          python -m venv .cache/pypi-install
          .cache/pypi-install/bin/python -m pip install --index-url https://pypi.org/simple "dynamo-diff[mcp]==${RELEASE_VERSION}"
          .cache/pypi-install/bin/dynamo-diff --version
          .cache/pypi-install/bin/python -m pip check
      - name: Verify the public installation and recorded demonstrations
        run: |
          .cache/pypi-install/bin/python -m pip install --require-hashes -r requirements-test.lock
          .cache/pypi-install/bin/python tools/check_release.py --require-wheel --junit artifacts/pypi-install-tests.xml
